name: Daily Newsletter

on:
  push:
    branches:
      - main
  # GitHub cron is UTC only and does not follow US daylight saving time, so each
  # local run time is scheduled twice (EDT and EST offsets). The "Check local
  # publish hour" step below drops whichever half of the pair is off-hour, so
  # each slot fires exactly once per day in America/New_York.
  schedule:
    - cron: '0 9 * * *'   # 5 AM EDT
    - cron: '0 10 * * *'  # 5 AM EST
    - cron: '0 18 * * *'  # 2 PM EDT
    - cron: '0 19 * * *'  # 2 PM EST
    - cron: '0 0 * * *'   # 8 PM EDT
    - cron: '0 1 * * *'   # 8 PM EST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Each publish slot has two cron entries (EDT and EST). Skip the one that
      # is not currently the intended local hour. Manual and push runs bypass this.
      - name: Check local publish hour
        id: hour_gate
        run: |
          LOCAL_HOUR=$(TZ=America/New_York date +%-H)
          echo "Local hour in America/New_York: ${LOCAL_HOUR}"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$LOCAL_HOUR" = "5" ] || [ "$LOCAL_HOUR" = "14" ] || [ "$LOCAL_HOUR" = "20" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Off-hour duplicate of a DST cron pair, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.hour_gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.hour_gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.hour_gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          python -c "import nltk; nltk.download('punkt_tab', quiet=True); nltk.download('punkt', quiet=True)"

      - name: Start Tor proxy
        if: steps.hour_gate.outputs.run == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tor > /dev/null
          # Enable control port for circuit rotation (no auth needed in CI)
          echo -e "ControlPort 9051\nCookieAuthentication 0" | sudo tee -a /etc/tor/torrc > /dev/null
          sudo service tor restart
          sleep 8
          # Verify Tor is working
          curl -s --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip || echo "Tor check failed, continuing anyway"

      - name: Restore site archive
        if: steps.hour_gate.outputs.run == 'true'
        run: |
          git fetch origin gh-pages --depth=1 || true
          git checkout origin/gh-pages -- site/ 2>/dev/null || echo "No existing site archive"

      - name: Run newsletter
        if: steps.hour_gate.outputs.run == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.newsletter 2>&1 | tee /tmp/newsletter-build.log

      - name: Validate summary quality
        if: steps.hour_gate.outputs.run == 'true'
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path
          from datetime import datetime

          today = datetime.now().strftime('%Y-%m-%d')
          archive = Path(f'site/posts/{today}.json')
          if not archive.exists():
              print('WARNING: No archive JSON for today')
              sys.exit(0)

          data = json.loads(archive.read_text())

          # Check all content sections have real summaries (not just fallbacks)
          fallback_phrases = ['click for details', 'click to watch', 'read the full', 'new video', 'new episode from']
          sections = {'news': data.get('news', []), 'youtube': data.get('youtube', []), 'ai_security': data.get('ai_security', [])}

          for section, items in sections.items():
              total = len(items)
              weak = 0
              for item in items:
                  summary = (item.get('summary') or '').lower()
                  if not summary or len(summary) < 40 or any(f in summary for f in fallback_phrases):
                      weak += 1
                      print(f'  WEAK [{section}]: {item.get(\"title\", \"?\")[:60]}')
              print(f'{section}: {total - weak}/{total} items have substantive summaries')
          "

      - name: Validate Pages email parity
        if: steps.hour_gate.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import sys

          today = datetime.now().strftime('%Y-%m-%d')
          post = Path(f'site/posts/{today}.html')
          email = Path(f'site/posts/{today}.email.html')
          index = Path('site/index.html')

          missing = [str(p) for p in (post, email, index) if not p.exists()]
          if missing:
              sys.exit(f'Missing Pages output: {missing}')

          if post.read_text() != email.read_text():
              sys.exit('Pages post HTML must match generated email HTML exactly.')

          index_html = index.read_text()
          for marker in ('Daily Morning Briefing', 'Top 3 Things', 'NYC Weather'):
              if marker not in index_html:
                  sys.exit(f'Missing compact email marker in site/index.html: {marker}')

          print('Pages output matches generated email HTML.')
          PY

      - name: Upload Pages artifact
        if: steps.hour_gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        if: steps.hour_gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit site to gh-pages branch
        if: steps.hour_gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f site/
          git stash
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rf . 2>/dev/null || true
          git stash pop 2>/dev/null || true
          git checkout stash -- site/ 2>/dev/null || git checkout main -- site/ 2>/dev/null || true
          cp -r site/* . 2>/dev/null || true
          git add -A
          git commit -m "Update newsletter site $(date +%Y-%m-%d)" || echo "No changes"
          git push origin gh-pages --force
